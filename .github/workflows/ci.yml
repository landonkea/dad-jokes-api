# =============================================================================
# CI Workflow — Automatically tests every push and pull request
# =============================================================================
# WHAT: This is a GitHub Actions workflow that runs our test suite automatically
#       every time code is pushed to main/dev or a PR targets main.
# WHY:  Automated testing catches bugs before they reach production. Without
#       this, you'd have to remember to run tests manually before every merge.
# HOW:  GitHub spins up a fresh Ubuntu VM, installs Node.js, sets up a
#       PostgreSQL database, installs dependencies, and runs all tests.
# =============================================================================

# "name" is the display name shown in the Actions tab of the GitHub repo.
name: CI

# "on" defines WHEN this workflow should run. GitHub will trigger it
# automatically based on these conditions.
on:

  # Run when someone pushes (commits) to the "main" or "dev" branches.
  push:
    branches: [main, dev]

  # Run when someone opens or updates a pull request targeting "main."
  # This ensures PRs are tested before they can be merged.
  pull_request:
    branches: [main]

# "jobs" defines one or more independent jobs that run in this workflow.
# Each job runs on its own fresh virtual machine.
jobs:

  # "test" is the name of our job. It contains all the steps below.
  test:

    # "runs-on" specifies the operating system for the virtual machine.
    # "ubuntu-latest" gives us the newest Ubuntu LTS — the most common
    # and best-supported environment for CI pipelines.
    runs-on: ubuntu-latest

    # "services" starts additional Docker containers alongside our job.
    # Here we spin up a PostgreSQL database for testing. GitHub Actions
    # automatically manages these containers — starting, stopping, and
    # cleaning them up when the job finishes.
    services:

      # "postgres" is the service name (we reference it in connection vars).
      postgres:

        # The PostgreSQL Docker image to use.
        image: postgres:16

        # Environment variables passed to the PostgreSQL container.
        # These create the test database and credentials on startup.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dad_jokes_test   # Separate test DB (not "dad_jokes")

        # "options" passes extra Docker flags to the service container.
        # These health check options tell GitHub Actions to WAIT until
        # PostgreSQL is fully ready before running our test steps.
        # Without this, tests might try to connect before the DB is up.
        options: >-
          --health-cmd pg_isready          # Command to check if PG is ready
          --health-interval 10s            # Check every 10 seconds
          --health-timeout 5s              # Fail check after 5 seconds
          --health-retries 5               # Try 5 times before giving up

        # Map PostgreSQL's port inside the container to port 5432 on the
        # GitHub Actions VM so our tests can connect to it via localhost.
        ports:
          - 5432:5432

    # "steps" is the ordered list of tasks this job performs.
    steps:

      # Step 1: Check out (download) the repository's source code.
      # Without this, the VM has no code to test!
      # "actions/checkout@v4" is the official GitHub checkout action.
      - uses: actions/checkout@v4

      # Step 2: Install and set up Node.js 20 on the VM.
      # "actions/setup-node@v4" is the official action that installs Node.js
      # and adds it to the system PATH so we can use "node" and "npm" commands.
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Specify exactly Node.js version 20

      # Step 3: Install root-level dependencies (like "concurrently").
      - name: Install root dependencies
        run: npm install

      # Step 4: Install server dependencies.
      # "working-directory: server" makes the command run inside the server/
      # folder, equivalent to "cd server && npm install".
      - name: Install server dependencies
        run: npm install
        working-directory: server

      # Step 5: Install client dependencies.
      - name: Install client dependencies
        run: npm install
        working-directory: client

      # Step 6a: Typecheck the server.
      # "npx tsc --noEmit" runs the TypeScript compiler in check-only mode —
      # it reports type errors without writing any output files. This catches
      # type mistakes that tests alone might miss.
      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      # Step 6b: Typecheck the client.
      - name: Typecheck client
        run: npx tsc --noEmit
        working-directory: client

      # Step 6: Run the server's test suite.
      # "npm run test:run" executes vitest in single-run mode (no watch).
      # The env block passes database connection details so tests can
      # connect to the PostgreSQL service started above.
      - name: Run server tests
        run: npm run test:run
        working-directory: server
        env:
          DB_HOST: localhost       # Points to the PostgreSQL service above
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: dad_jokes_test  # Uses the test database, not production!
          # Needed by the DELETE /api/jokes/:id integration tests — without this,
          # requireAdminToken fails closed (503) for every request, before the
          # 401/200/404 cases under test ever get exercised.
          ADMIN_TOKEN: test-admin-token

      # Step 7: Run the client's test suite.
      # Client tests don't need a database — they test React components
      # in isolation using jsdom (a fake browser environment).
      - name: Run client tests
        run: npm run test:run
        working-directory: client

      # Step 8: Generate a persisted test-results summary (pass/fail counts + timestamp).
      # This re-runs both suites (via scripts/generate-test-summary.js, using vitest's JSON
      # reporter) and writes test-results/latest.json + latest.md. It's additive to steps 6/7
      # above — those remain the actual pass/fail gate for this job — this step exists purely
      # to leave behind a persisted artifact (see the upload step below) instead of requiring
      # anyone to dig through raw CI logs to answer "did the tests pass, and when."
      # "if: always()" runs this even if an earlier step failed, so a failing build still
      # gets a summary showing the failure instead of no artifact at all.
      - name: Generate test-results summary
        if: always()
        run: npm run test:summary
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: dad_jokes_test
          ADMIN_TOKEN: test-admin-token

      # Step 9: Upload test-results/ as a downloadable build artifact.
      # "if: always()" ensures this runs (and the summary is available) even when the
      # summary step above reports failures, so a red build still leaves a diagnosable
      # artifact instead of nothing.
      - name: Upload test-results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # JOB 2: "docker" — Builds the production Docker image and smoke-tests it
  # ---------------------------------------------------------------------------
  # WHAT: Builds the image defined by the root Dockerfile, runs it against a real
  #       Postgres service container, and hits a couple of real endpoints to
  #       confirm the container actually boots and serves traffic.
  # WHY:  "npm test" passing doesn't guarantee the Docker image itself is
  #       buildable or bootable (e.g. missing build steps, wrong paths, a
  #       startup script that silently fails). This catches that class of bug
  #       in CI instead of someone discovering it the next time they run
  #       "docker compose up". Additive — runs alongside "test" (independent
  #       job) rather than replacing anything in it.
  docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dad_jokes_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # Build the production image from the root Dockerfile. This exercises the exact
      # same multi-stage build (server compile, client build, slim runtime image) that
      # "docker compose up --build" runs locally.
      - name: Build Docker image
        run: docker build -t dad-jokes-api:ci .

      # Run the built image against the Postgres service container started above.
      # "--network host" lets the container reach the service on "localhost:5432"
      # (GitHub Actions maps service container ports onto the runner's own localhost),
      # matching how a developer's local Postgres is typically reached without Docker's
      # internal DNS getting involved.
      - name: Start container
        run: |
          docker run -d --name dad-jokes-smoke --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_NAME=dad_jokes_test \
            -e PORT=3001 \
            dad-jokes-api:ci

      # Poll /api/health until the container is up (docker-entrypoint.sh needs a moment
      # to run db/init.js + db/seedIfEmpty.js before the server starts listening), then
      # hit a real data endpoint to confirm the whole stack — container, DB init, schema,
      # seeding, and the Express server — actually works end-to-end.
      - name: Smoke test container
        run: |
          echo "Waiting for the container to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "Container is up after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container never became healthy."
              docker logs dad-jokes-smoke
              exit 1
            fi
            sleep 2
          done

          echo "GET /api/health:"
          curl -sf http://localhost:3001/api/health | tee /dev/stderr | grep -q '"status":"alive"'

          echo "GET /api/jokes:"
          curl -sf http://localhost:3001/api/jokes | tee /dev/stderr | grep -q '"success":true'

      # Always show container logs and tear it down, whether the smoke test passed or
      # failed, so a failure is debuggable from the Actions log without needing SSH access.
      - name: Container logs
        if: always()
        run: docker logs dad-jokes-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f dad-jokes-smoke || true
